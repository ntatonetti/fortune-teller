<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Her history</title>
    <style>
      :root {
        --paper: #e3e7dc;
        --sheet: #f1f3ec;
        --ink: #22302c;
        --muted: #5e6b64;
        --rule: #b9c1b2;
        --brass: #8c6a1f;
        --oxblood: #7b2632;
        --her: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui); }
      header { padding: 28px 32px 18px; border-bottom: 1px solid var(--rule); }
      h1 { margin: 0 0 4px; font: 400 34px/1.1 var(--her); letter-spacing: -0.01em; }
      .lede { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
      select, input[type="search"] {
        font: inherit; color: var(--ink); background: var(--sheet);
        border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px;
      }
      input[type="search"] { width: min(320px, 100%); }
      a { color: var(--brass); }
      :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
      .tally { margin: 14px 0 0; color: var(--muted); }
      .tally b { color: var(--ink); font-weight: 600; }
      main { padding: 8px 32px 64px; }
      .empty { padding: 40px 0; color: var(--muted); max-width: 60ch; }

      details.visit { border-bottom: 1px solid var(--rule); }
      details.visit > summary {
        list-style: none; cursor: pointer; padding: 12px 0;
        display: grid; grid-template-columns: 7.5em 4.5em 1fr; gap: 0 14px; align-items: baseline;
      }
      details.visit > summary::-webkit-details-marker { display: none; }
      details.visit[open] > summary { padding-bottom: 6px; }
      .when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .who { color: var(--muted); }
      .gist { min-width: 0; }
      .gist .costume { font-family: var(--her); font-size: 17px; }
      .gist .asked { display: block; color: var(--muted); }
      .gist .title { display: block; font-family: var(--her); font-style: italic; color: var(--brass); }
      .visit.quiet > summary { color: var(--muted); }
      .visit.quiet .costume { font-size: 15px; font-family: var(--ui); }
      .flag { color: var(--oxblood); font-weight: 600; }

      .call { margin: 0 0 18px calc(12em + 28px); padding: 14px 16px; background: var(--sheet); border-left: 3px solid var(--rule); }
      .call.fortune { border-left-color: var(--brass); }
      .call.failed { border-left-color: var(--oxblood); }
      .call h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
      .call h3 span { font-weight: 400; color: var(--muted); }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .pair h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, monospace; }
      details.sys { margin-bottom: 8px; }
      details.sys summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      details.sys pre { margin-top: 6px; color: var(--muted); }
      dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
      dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
      dd { margin: 0; }
      dd.said { font: 16px/1.6 var(--her); }
      .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
      .error { color: var(--oxblood); }

      @media (max-width: 820px) {
        header, main { padding-left: 16px; padding-right: 16px; }
        details.visit > summary { grid-template-columns: max-content 1fr; }
        .gist { grid-column: 1 / -1; }
        .call { margin-left: 0; }
        .pair { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Her history</h1>
      <p class="lede">
        Every call she makes to Claude: what she was told, and what she answered. Open a visit to read the prompts.
        The camera frames aren't kept.
      </p>
      <div class="controls">
        <label>Day <select id="day"></select></label>
        <label>Show
          <select id="show">
            <option value="readings">Visits with a fortune</option>
            <option value="all">Every visit</option>
            <option value="failed">Only failed calls</option>
          </select>
        </label>
        <input id="find" type="search" placeholder="Find words in prompts or answers" aria-label="Find" />
        <a id="download" href="#">Download this day (JSON lines)</a>
        <a href="/spend.html">What she costs</a>
      </div>
      <p class="tally" id="tally"></p>
    </header>
    <main id="list"></main>

    <script>
      const $ = (id) => document.getElementById(id);
      let calls = [];

      function el(tag, attrs = {}, ...kids) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) k === "text" ? (n.textContent = v) : n.setAttribute(k, v);
        for (const k of kids) if (k) n.append(k);
        return n;
      }

      // A short tag for each system prompt, so a change in her persona shows up across days.
      function tag(s) {
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
        return (h >>> 0).toString(16).padStart(8, "0").slice(0, 6);
      }

      const n = (k, one, many) => `<b>${k}</b> ${k === 1 ? one : many}`;
      const words = (s) => (s || "").split(/\s+/).filter(Boolean).length;
      const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const dayOf = (t) => new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" });

      // A greeting starts a visit; question checks and the fortune join the one before.
      function visits(list) {
        const out = [];
        for (const c of list) {
          if (c.kind === "greet" || !out.length) out.push([]);
          out[out.length - 1].push(c);
        }
        return out;
      }

      const LABEL = { greet: "Greeting", asked: "Finished asking?", probe: "Her question back", fortune: "Fortune", other: "Call" };
      const SAID = { greeting: "said", spoken: "said" };

      function output(c) {
        if (!c.output) return el("p", { class: "error", text: c.error || "no answer" });
        const dl = el("dl");
        for (const [k, v] of Object.entries(c.output)) {
          const said = k in SAID;
          const dd = el("dd", { class: said ? "said" : "", text: typeof v === "string" ? v : JSON.stringify(v) });
          if (said) dd.append(" ", el("span", { class: "count", text: `${words(v)} words` }));
          dl.append(el("dt", { text: k.replace(/_/g, " ") }), dd);
        }
        return dl;
      }

      function call(c) {
        const meta = [c.served_by && c.served_by !== c.model ? `${c.model} → ${c.served_by}` : c.model, c.effort,
          `${(c.ms / 1000).toFixed(1)} s`, c.tokens_in != null && `${c.tokens_in} in / ${c.tokens_out} out tokens`]
          .filter(Boolean).join(", ");
        return el("section", { class: `call ${c.kind}${c.output ? "" : " failed"}` },
          el("h3", {}, `${LABEL[c.kind] || c.kind} `, el("span", { text: `${clock(c.t)}, ${meta}` })),
          el("div", { class: "pair" },
            el("div", {},
              el("h4", { text: "What she was told" }),
              el("details", { class: "sys" }, el("summary", { text: `System prompt ${tag(c.system)}` }), el("pre", { text: c.system })),
              el("pre", { text: c.prompt })),
            el("div", {}, el("h4", { text: "What she answered" }), output(c))));
      }

      function heard(v) {
        const a = v.filter((c) => c.kind === "asked").pop();
        const m = a && a.prompt.match(/<heard>([\s\S]*?)<\/heard>/);
        const q = v.find((c) => c.kind === "fortune")?.prompt.match(/<question>([\s\S]*?)<\/question>/);
        return (q && q[1]) || (m && m[1]) || "";
      }

      function row(v, many) {
        const f = v.find((c) => c.kind === "fortune");
        const g = v.find((c) => c.kind === "greet");
        const first = (f || g || v[0]).output || {};
        const failed = v.filter((c) => !c.output).length;
        const q = heard(v);
        const d = el("details", { class: `visit${f ? "" : " quiet"}` });
        d.append(el("summary", {},
          el("span", { class: "when", text: many ? `${dayOf(v[0].t)} ${clock(v[0].t)}` : clock(v[0].t) }),
          el("span", { class: "who", text: first.audience || "" }),
          el("span", { class: "gist" },
            el("span", { class: "costume", text: first.costume || (f || g ? "" : LABEL[v[0].kind]) || "" }),
            failed ? el("span", { class: "flag", text: `${failed} failed` }) : null,
            q ? el("span", { class: "asked", text: `Asked: “${q}”` }) : null,
            f?.output ? el("span", { class: "title", text: f.output.card_title }) : !f && g ? el("span", { class: "asked", text: "No fortune" }) : null)));
        d.addEventListener("toggle", () => {
          if (d.open && d.children.length === 1) for (const c of v) d.append(call(c));
        });
        return d;
      }

      function render() {
        const find = $("find").value.trim().toLowerCase();
        const show = $("show").value;
        let vs = visits(calls);
        if (show === "readings") vs = vs.filter((v) => v.some((c) => c.kind === "fortune"));
        if (show === "failed") vs = vs.filter((v) => v.some((c) => !c.output));
        if (find) vs = vs.filter((v) => v.some((c) => (c.prompt + JSON.stringify(c.output || {}) + c.error).toLowerCase().includes(find)));
        const many = $("day").value === "all";
        const list = $("list");
        list.replaceChildren(...vs.reverse().map((v) => row(v, many)));
        if (!vs.length) list.append(el("p", { class: "empty", text: calls.length
          ? "No visits match. Clear the search, or show every visit."
          : "Nothing yet. Each guest she greets is added here as it happens." }));

        const fortunes = calls.filter((c) => c.kind === "fortune" && c.output);
        const ms = fortunes.map((c) => c.ms).sort((a, b) => a - b);
        const said = fortunes.map((c) => words(c.output.spoken));
        const parts = [
          n(visits(calls).length, "visit", "visits"), n(fortunes.length, "fortune", "fortunes"),
          n(calls.filter((c) => !c.output).length, "failed call", "failed calls"),
        ];
        if (ms.length) parts.push(`fortunes take <b>${(ms[ms.length >> 1] / 1000).toFixed(1)} s</b> (median)`,
          `and run <b>${Math.min(...said)}–${Math.max(...said)}</b> words`);
        $("tally").innerHTML = parts.join(", ");
      }

      async function load() {
        const day = $("day").value;
        const days = day === "all" ? [...$("day").options].map((o) => o.value).filter((d) => d !== "all") : [day];
        const got = await Promise.all(days.map((d) => fetch(`/api/history/${d}`).then((r) => (r.ok ? r.json() : []))));
        calls = got.flat().sort((a, b) => a.t - b.t);
        $("download").hidden = day === "all";
        $("download").href = `/api/history/${day}.jsonl`;
        render();
      }

      (async () => {
        const days = await fetch("/api/history").then((r) => r.json());
        $("day").append(...days.map((d) => el("option", { value: d.day, text: `${d.day} (${d.calls} calls)` })));
        if (days.length > 1) $("day").append(el("option", { value: "all", text: "All days" }));
        if (!days.length) {
          $("download").hidden = true;
          $("list").append(el("p", { class: "empty", text: "Nothing yet. Each guest she greets is added here as it happens." }));
          return;
        }
        $("day").addEventListener("change", load);
        $("show").addEventListener("change", render);
        $("find").addEventListener("input", render);
        load();
      })();
    </script>
  </body>
</html>
